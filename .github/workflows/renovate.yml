name: Renovate
# Self-hosted Renovate via GitHub Actions — no GitHub App installation needed.
# Each repo gets this workflow + a renovate.json config file.
# The workflow is triggered weekly (Mon before 5am IST = Sun 23:30 UTC) and on-demand.

on:
  schedule:
    # Every Monday at 03:30 IST = Sunday 22:00 UTC
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    # runs-on stays ubuntu-latest DELIBERATELY. This repo is PUBLIC, and public repos get
    # unlimited free GitHub-hosted Actions minutes -- this job has succeeded on a hosted runner
    # every week without interruption. The fleet's PRIVATE repos do fail here (their job is
    # queued with labels=ubuntu-latest, no runner assigned, and zero log output) because the
    # account's free minutes for private repos are exhausted; those repos move to self-hosted.
    # Do NOT copy that change here: no self-hosted runner is registered for this repo, so
    # pointing at one would queue this job forever. Verified 2026-08-21.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Generate vagary-renovate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        with:
          configurationFile: .github/renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'ignored'
          RENOVATE_PLATFORM: 'github'
          RENOVATE_GIT_AUTHOR: 'Renovate Bot <bot@renovate.com>'
