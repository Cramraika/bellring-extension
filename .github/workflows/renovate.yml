name: Renovate
# Self-hosted Renovate via GitHub Actions — no GitHub App installation needed.
# Each repo gets this workflow + a renovate.json config file.
# The workflow is triggered weekly (Mon before 5am IST = Sun 23:30 UTC) and on-demand.

on:
  schedule:
    # Every Monday at 03:30 IST = Sunday 22:00 UTC
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ${{ vars.RUNNER_TYPE || 'self-hosted' }}   # hosted runners are unavailable for this account: these jobs were queued with
                                                  # labels=ubuntu-latest, no runner assigned and no log output — they never ran at all.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Generate vagary-renovate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # Renovate runs from the CLI, NOT renovatebot/github-action: that action runs Renovate
      # inside a container, and on the self-hosted Mac runner Docker is colima — when colima is
      # not up at the scheduled time the step dies before Renovate starts. Proven fix: vps-ansible
      # went green this way and opened its first Renovate PRs since 2026-08-09.
      # Version pinned, and looked up (`npm view renovate version`) rather than guessed — an
      # invented pin fails with npm ETARGET, which is how the first attempt at this failed.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Self-hosted Renovate
        run: npx --yes renovate@44.37.1
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_CONFIG_FILE: .github/renovate.json
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'ignored'
          RENOVATE_PLATFORM: 'github'
          RENOVATE_GIT_AUTHOR: 'Renovate Bot <bot@renovate.com>'
