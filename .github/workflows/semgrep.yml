# =============================================
# Semgrep CI — SAST coverage
# =============================================
# Wired 2026-05-19 to replace CodeQL after the auto-fire disable across
# 8 Cramraika repos. Semgrep was previously only running as a fleet
# Bash CLI hook on the operator's Mac (not as per-repo CI). This adds
# real per-repo SAST coverage.
#
# Runner-label discipline: matches the cramraika-actions-budget
# migration pattern — `${{ vars.RUNNER_TYPE || 'self-hosted' }}`.
# Cramraika billing blocks GitHub-hosted (ubuntu-latest) runners;
# do NOT change to ubuntu-latest.
#
# Note: no `container:` directive — fleet self-hosted runners are
# macOS-ARM64 and don't support container jobs. Semgrep is installed
# via pip into a user-writable cache, mirroring the Trivy install
# pattern in ci.yml.
#
# 2026-05-19 framework fix: switched from `semgrep ci` to
# `semgrep scan` because the runner host (operator's Mac) has a
# cached login token at `~/.semgrep/settings.yml`. `semgrep ci`
# refuses `--config` flags while logged in (uploads to semgrep-app
# dashboard rules instead). `semgrep scan` honors --config directly
# and bypasses the login mutex.
# =============================================

name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ${{ vars.RUNNER_TYPE || 'self-hosted' }}
    if: (github.actor != 'dependabot[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # fetch-depth 0 because the gate below diffs against a BASELINE commit.
          # The default of 1 leaves github.event.before outside the object store, so the
          # baseline silently fails to resolve and the scan drops to advisory — a gate that
          # cannot fail, which is the defect this workflow was just fixed for.
          fetch-depth: 0

      - name: Install Semgrep
        run: |
          set -euo pipefail
          # A VENV, NOT `pip install --user`. The runner's python3 is Homebrew-managed, and Homebrew
          # marks its interpreter externally-managed (PEP 668), so `--user` does not fall back to a user
          # site — it REFUSES:
          #
          #     error: externally-managed-environment
          #
          # The `--break-system-packages` escape hatch pip suggests would write into the Homebrew prefix
          # of a machine that is also the operator's workstation, to install a linter. A venv is the
          # sanctioned path and leaves the runner's python untouched.
          #
          # Cache-guarded on the BINARY being executable, not on the directory existing — the same
          # reasoning the Trivy install states: a partial or interrupted install leaves the directory
          # present and the tool unusable, which is exactly the state a presence check reports as fine.
          SEMGREP_DIR="${RUNNER_TOOL_CACHE:-$HOME/.cache}/semgrep/venv"
          if [ ! -x "${SEMGREP_DIR}/bin/semgrep" ]; then
            rm -rf "${SEMGREP_DIR}"
            python3 -m venv "${SEMGREP_DIR}"
            "${SEMGREP_DIR}/bin/python" -m pip install --quiet --upgrade pip
            "${SEMGREP_DIR}/bin/python" -m pip install --quiet --upgrade semgrep
          fi
          echo "${SEMGREP_DIR}/bin" >> "${GITHUB_PATH}"
          "${SEMGREP_DIR}/bin/semgrep" --version

      - name: Semgrep scan (default + security-audit + secrets)
        env:
          # Force-unset to avoid `semgrep ci` logged-in mutex if a token
          # is cached in `~/.semgrep/settings.yml` on the runner host.
          # We use `semgrep scan` (not `semgrep ci`) which honors --config
          # directly; this env is belt-and-braces.
          SEMGREP_APP_TOKEN: ''
          # THE BASELINE SHA, WHICH THE SCRIPT BELOW READS AND NOTHING EVER SET. `EVENT_BEFORE` is not
          # an Actions-provided variable — unlike GITHUB_EVENT_NAME and GITHUB_BASE_REF, which the
          # runner exports itself — so it has to be mapped from the event payload here. It never was.
          #
          # The consequence was not a wrong baseline, it was NO baseline: `${EVENT_BEFORE:-}` expanded
          # empty on every run, the empty case set BASELINE="", and the push branch fell through to
          # "Refusing to report a green gate from an ungated scan" and exited 1. This gate has been
          # structurally incapable of passing on a push since it was written.
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
            # BASELINE, computed per event. `|| echo` used to be on the end of this scan, which
            # made the step exit 0 whatever semgrep returned and left `--error` inert — the gate
            # could not fail. It was not removable on its own: these repos carry hundreds of
            # pre-existing findings, so a bare `--error` fails every push forever and gets reverted.
            # Gating on NEW findings is what makes failing sustainable.
            #
            # The obvious `git merge-base origin/main HEAD` is right for a pull_request and WRONG for
            # a push to main: after the push HEAD *is* origin/main, so merge-base returns HEAD, the
            # diff is empty, and the gate passes unconditionally — the same defect wearing a new hat.
            # For a push the baseline must be where the branch was BEFORE it.
            BASELINE=""
            case "${GITHUB_EVENT_NAME}" in
              pull_request)
                git fetch --quiet origin "${GITHUB_BASE_REF}" || true
                BASELINE="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD || true)"
                ;;
              push)
                BEFORE="${EVENT_BEFORE:-}"
                # All-zeros means a newly created branch — there is no "before" to diff against.
                case "${BEFORE}" in
                  ""|0000000000000000000000000000000000000000) BASELINE="" ;;
                  *) git cat-file -e "${BEFORE}^{commit}" 2>/dev/null && BASELINE="${BEFORE}" || BASELINE="" ;;
                esac
                ;;
            esac

            # A baseline equal to HEAD means an empty diff, which semgrep reports as clean. That is
            # indistinguishable from a passing gate, so refuse rather than report success.
            if [ -n "${BASELINE}" ] && [ "${BASELINE}" = "$(git rev-parse HEAD)" ]; then
              echo "Baseline resolved to HEAD — the diff would be empty and this gate would pass" >&2
              echo "without scanning anything. Refusing. Event=${GITHUB_EVENT_NAME}" >&2
              exit 1
            fi

            if [ -n "${BASELINE}" ]; then
              echo "Gating on findings NEW since ${BASELINE}"
              semgrep scan \
                --config=p/default \
                --config=p/security-audit \
                --config=p/secrets \
                --sarif --sarif-output=results.sarif \
                --metrics=off \
                --baseline-commit "${BASELINE}" \
                --error
            elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              # Advisory is correct ONLY here: a manual run has nothing meaningful to diff against.
              # The SARIF still uploads, so the finding set stays visible without failing on
              # inherited debt.
              echo "Manual run — full scan, advisory only"
              semgrep scan \
                --config=p/default \
                --config=p/security-audit \
                --config=p/secrets \
                --sarif --sarif-output=results.sarif \
                --metrics=off
            else
              # On push and pull_request an unresolvable baseline is a BROKEN GATE, not a reason to
              # relax. Falling through to an advisory scan here is how the first version of this fix
              # was still green-by-construction: checkout defaults to fetch-depth 1, so
              # github.event.before was absent from the shallow object store, cat-file failed, and
              # every push quietly took the advisory path. fetch-depth: 0 above is what makes the
              # baseline resolvable; this branch is what makes its ABSENCE loud instead of silent.
              echo "Baseline could not be resolved for event=${GITHUB_EVENT_NAME}." >&2
              echo "Refusing to report a green gate from an ungated scan. Check that the checkout" >&2
              echo "step uses fetch-depth: 0 and that the base ref was fetched." >&2
              exit 1
            fi

      - name: Upload SARIF artifact
        if: always()
        continue-on-error: true
        # Sink changed from upload-artifact to upload-sarif. The artifact sink had NO READER —
        # every reference to "semgrep-sarif" across the workspace was a producer, none a consumer
        # (control: the same grep for "upload-artifact" matched 20 files). A SARIF file nothing
        # opens is a scan whose findings exist and are never seen: the display-layer twin of the
        # gate that could not fail, fixed in the same commit series.
        #
        # Free on public repos — code-scanning/alerts returns 404 "no analysis found" here rather
        # than the 403 the private repos return, so the feature is available and merely empty.
        # SHA-pinned to match this repo's convention (and because a mutable tag on a sink with
        # security-events:write is exactly the finding semgrep raises against the siblings).
        # v3 → f3712979, verified against the API with a bogus-SHA negative control.
        #
        # Checked before publishing: 6 findings here, all `warning`, zero ERROR — 3 xss,
        # 2 missing-integrity, 1 renovate config. This repo's source is already world-readable, so
        # indexing its lint findings is not new disclosure.
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: results.sarif
          category: semgrep
